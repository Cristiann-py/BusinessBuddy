{% load static %}

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BusinessBuddy</title>
        <link rel="stylesheet" href="{% static 'style.css' %}" />
    </head>
    <body>
        <header>
            <h1>Welcome to Business Buddy</h1>
        </header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
            </ul>
        </nav>
        <main>
            <center><h2>Polls</h2></center>
            {% if latest_question_list %}
            <ul class="polls-list">
                {% for question in latest_question_list %}
                <li>
                    <div
                        class="choice-container"
                        onclick="window.location.href='{% url 'polls:polls_detail' question.id %}'"
                    >
                        {{ question.question_text }}
                    </div>
                </li>
                {% endfor %}
            </ul>
            {% else %}
            <p>No polls are available.</p>
            {% endif %}
        </main>
    </body>
</html>
